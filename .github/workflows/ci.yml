name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 새 커밋이 오면 앞선 검사를 멈춤
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint와 typecheck가 contracts의 타입 파일(dist)을 읽으므로 빌드를 먼저 함
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test
